version: "3.7"

services:

  zynus:
    build: .
    container_name: zynus-container
    ports:
      - "8000:8000"
    environment:
      MODEL: ${MODEL}
      EMB_MODEL: ${EMB_MODEL}
      EMB_MODEL_PROVIDER: ${EMB_MODEL_PROVIDER}
      LLM_PROVIDER: ${LLM_PROVIDER}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OLLAMA_URL: ${OLLAMA_URL}
      DATABASE_URL: ${DATABASE_URL}
      SANDBOX_URL: ${SANDBOX_URL}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
    restart: unless-stopped
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    networks:
      - default
      - isolated-net
    depends_on:
      - mysql
      - redis
      - qdrant

  ollama:
    image: ollama/ollama
    container_name: zynus-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    networks:
      - default

  rq:
    build: .
    container_name: zynus-rq
    command: rq worker memory-write
    environment:
      OLLAMA_URL: ${OLLAMA_URL}
      DATABASE_URL: ${DATABASE_URL}
      SANDBOX_URL: ${SANDBOX_URL}
      REDIS_URL: ${REDIS_URL}
      QDRANT_URL: ${QDRANT_URL}
    restart: unless-stopped
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    networks:
      - default
      - isolated-net
    depends_on:
      - redis
      - mysql

  mysql:
    image: mysql:5.5
    container_name: zynus-mysql
    ports:
      - "3306:3306"
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - default

  sandbox:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    container_name: zynus-sandbox
    ports:
      - "7070:7070"
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
      nproc: 128
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    restart: unless-stopped
    networks:
      - isolated-net

  qdrant:
    image: qdrant/qdrant
    container_name: zynus-qdrant
    ports:
      - "6333:6333"
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    security_opt:
      - seccomp=unconfined
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: zynus-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - default

  prometheus:
    image: prom/prometheus
    container_name: zynus-prometheus
    ports:
      - "9091:9090"
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - default

  grafana:
    image: grafana/grafana
    container_name: zynus-grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - default

networks:
  isolated-net:
    driver: bridge
    internal: true

volumes:
  mysql_data:
  ollama_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  hf_cache: